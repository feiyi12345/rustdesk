name: Flutter Nightly Build

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# Nightly used to call flutter-build.yml for every platform. That reusable
# workflow does not start on this fork. Windows builds are tag/manual via
# windows-release.yml.
jobs:
  skipped-on-fork:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Nightly multi-platform build is disabled on this fork."
