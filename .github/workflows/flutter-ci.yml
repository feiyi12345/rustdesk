name: Full Flutter CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
    - "docs/**"
    - "README.md"
  push:
    branches:
      - master
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "README.md"
      - "res/**"
      - "appimage/**"
      - "flatpak/**"

# The upstream job called .github/workflows/flutter-build.yml, which also builds
# macOS, Linux, Android and signed update metadata. Loading that reusable
# workflow fails on this fork (startup_failure) because those jobs expect
# upstream-only secrets and runners. Windows installers are published by
# windows-release.yml instead.
jobs:
  skipped-on-fork:
    runs-on: ubuntu-latest
    steps:
      - name: Upstream Flutter matrix is not run on this fork
        run: echo "Use the Windows installer workflow (.github/workflows/windows-release.yml)."
