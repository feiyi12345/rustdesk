name: Flutter Tag Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-[0-9]+'

# Version tags used to call flutter-build.yml. That workflow cannot start on
# this fork. wuxian-* tags are handled by windows-release.yml.
jobs:
  skipped-on-fork:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Version-tag multi-platform build is disabled. Push a wuxian-* tag for the Windows installer."
